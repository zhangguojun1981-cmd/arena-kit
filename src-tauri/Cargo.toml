[package]
name = "arena-kit"
version = "0.1.0"
description = "ArenaKit — cross-platform arena.ai enhancement client"
edition = "2021"
rust-version = "1.77"

[lib]
name = "arena_kit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# `unstable` is required for multi-webview windows (Window::add_child) and
# Manager::get_webview, which the desktop split view relies on.
tauri = { version = "2.12", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["full"] }
base64 = "0.22"

[profile.release]
strip = true
lto = "thin"
