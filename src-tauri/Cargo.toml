[package]
name = "arena-kit"
version = "0.4.1"
description = "ArenaKit — cross-platform arena.ai enhancement client"
edition = "2021"
rust-version = "1.77"

[lib]
name = "arena_kit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["full"] }
base64 = "0.22"

[dev-dependencies]
# unit tests for trace.rs / pulse.rs mirror core.test.mjs and ArenaProtocolTest.kt
