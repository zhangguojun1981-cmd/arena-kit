[package]
name = "arena-kit"
version = "0.5.0"
description = "ArenaKit — cross-platform arena.ai enhancement client"
edition = "2021"
rust-version = "1.77"

[lib]
name = "arena_kit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["full"] }
base64 = "0.22"

[dev-dependencies]
# (none — the unit tests in trace.rs / usage.rs / links.rs / store.rs use std only)
