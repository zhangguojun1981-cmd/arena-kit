<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ArenaKit Dock</title>
  <link rel="stylesheet" href="dock.css" />
</head>
<body>
  <!-- ArenaKit native side dock. Lives in its OWN webview (not injected into
       arena.ai), docked to the right of the arena.ai webview. Decoupled from
       the page DOM, so arena redesigns never break it. -->
  <header class="ak-head">
    <span class="ak-logo">AK</span>
    <span class="ak-title">ArenaKit</span>
  </header>

  <!-- Module: server-side model (from the trace forensics pipeline) -->
  <section class="ak-mod" data-open="true">
    <div class="ak-mod-head"><span>服务端模型</span><span class="ak-chev">▾</span></div>
    <div class="ak-mod-body">
      <div id="ak-model" class="ak-big">—</div>
      <div id="ak-model-sub" class="ak-sub">发一条消息后自动识别</div>
      <div id="ak-session" class="ak-sub ak-mono"></div>
    </div>
  </section>

  <!-- Module: Token / trace cost (observed labels only, never inferred) -->
  <section class="ak-mod" data-open="true">
    <div class="ak-mod-head"><span>使用额度（Token / 费用）</span><span class="ak-chev">▾</span></div>
    <div class="ak-mod-body">
      <div class="ak-kv"><span class="ak-k">本轮</span><span id="ak-usage-run" class="ak-v">未提供</span></div>
      <div class="ak-kv"><span class="ak-k">本会话</span><span id="ak-usage-session" class="ak-v">未提供</span></div>
      <div class="ak-kv"><span class="ak-k">累计</span><span id="ak-usage-total" class="ak-v">未提供</span></div>
      <div id="ak-usage-calls" class="ak-sub ak-calls"></div>
      <div class="ak-btns">
        <button class="ak-btn ak-btn-sm" data-action="export-evidence">导出证据 JSON</button>
      </div>
      <textarea id="ak-export" class="ak-textarea" hidden readonly></textarea>
    </div>
  </section>

  <!-- Module: daily-free-credit gauge -->
  <section class="ak-mod" data-open="true">
    <div class="ak-mod-head"><span>额度</span><span class="ak-chev">▾</span></div>
    <div class="ak-mod-body">
      <div class="ak-row"><span id="ak-credit" class="ak-big">—</span><span id="ak-reset" class="ak-sub"></span></div>
      <div class="ak-bar"><div id="ak-bar-fill"></div></div>
    </div>
  </section>

  <!-- Module: local conversation → model history (never leaves the device) -->
  <section class="ak-mod">
    <div class="ak-mod-head"><span>会话历史</span><span class="ak-chev">▾</span></div>
    <div class="ak-mod-body">
      <input id="ak-history-q" class="ak-input" type="search" placeholder="搜索标题 / 模型 / 会话 ID" />
      <div id="ak-history-list" class="ak-list"></div>
      <div class="ak-btns">
        <button class="ak-btn ak-btn-sm" data-action="history-export">导出全部</button>
        <button class="ak-btn ak-btn-sm ak-danger" data-action="history-clear">清空历史</button>
      </div>
      <div id="ak-history-sub" class="ak-sub"></div>
    </div>
  </section>

  <!-- Module: enhancement toggles + panels -->
  <section class="ak-mod" data-open="true">
    <div class="ak-mod-head"><span>功能模块</span><span class="ak-chev">▾</span></div>
    <div class="ak-mod-body">
      <button class="ak-btn" data-action="manager">模型筛选 / 管理面板</button>
      <label class="ak-switch"><input type="checkbox" id="ak-unlock-opus" checked /> 解锁 Opus 全系</label>
      <label class="ak-switch"><input type="checkbox" id="ak-unlock-hidden" /> 解锁隐藏 / 盲测模型</label>
      <label class="ak-switch"><input type="checkbox" id="ak-plus" checked /> 排行榜性价比列</label>
    </div>
  </section>

  <!-- Module: system-prompt injection (ENI) -->
  <section class="ak-mod">
    <div class="ak-mod-head"><span>提示词注入</span><span class="ak-chev">▾</span></div>
    <div class="ak-mod-body">
      <label class="ak-switch"><input type="checkbox" id="ak-eni-on" /> 每新对话注入系统提示词</label>
      <textarea id="ak-eni-text" class="ak-textarea" placeholder="在此输入系统提示词…"></textarea>
      <button class="ak-btn ak-btn-sm" data-action="save-eni">保存提示词</button>
    </div>
  </section>

  <footer class="ak-foot"><span id="ak-status">就绪</span></footer>
  <script type="module" src="dock.js"></script>
</body>
</html>
