name: build

on:
  push:
    branches: [main, "arena/**"]
  workflow_dispatch:

jobs:
  # Pure-JS logic (src/lib) + injected page scripts — zero-dependency node:test.
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check (injected bundle + dock)
        run: node scripts/check-syntax.mjs
      - name: node --test
        run: node --test 'tests/**/*.test.mjs'

  # Rust core unit tests (trace/usage/store logic) — fast gate, runs everywhere.
  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri (and thus this crate) links against webkit2gtk on Linux even for
      # `cargo test --lib`; install the headers the build scripts look for.
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev pkg-config libxdo-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Cargo test (core logic)
        working-directory: src-tauri
        run: cargo test --lib

  # macOS .dmg — real bundle artifact.
  macos-dmg:
    needs: [rust-test, node-test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build dmg
        run: cargo tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: arenakit-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg

  # Android .apk — debug-signed arm64 apk (installable on a device without a
  # release keystore). gen/android is not committed; `tauri android init`
  # regenerates it here.
  android-apk:
    needs: [rust-test, node-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # setup-android v3 tried to install the removed legacy "tools" package and
      # failed; v4 takes an explicit package list (NDK included).
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Android init + build
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"
          export ANDROID_NDK_HOME="$NDK_HOME"
          echo "NDK_HOME=$NDK_HOME"
          cargo tauri android init --ci --skip-targets-install
          cargo tauri icon src-tauri/icons/icon.png || true
          cargo tauri android build --apk --debug --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: arenakit-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
