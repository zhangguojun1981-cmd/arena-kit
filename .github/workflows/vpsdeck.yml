name: VPS Deck Android
on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/vpsdeck/**'
      - '.github/workflows/vpsdeck.yml'
permissions:
  contents: read
concurrency:
  group: vpsdeck-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/vpsdeck
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
      - name: Tests, APK and lint
        run: |
          set +e
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:lintDebug 2>&1 | tee build.log
          result=${PIPESTATUS[0]}
          python3 scripts/report_ci.py build.log
          exit "$result"
      - name: Prepare delivery
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk releases/VPSDeck-0.1.0-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk releases/VPSDeck-0.1.0-unsigned.apk
          git archive --format=zip HEAD:apps/vpsdeck > releases/VPSDeck-source.zip
          cp ../../VPSDECK_PLAN.md releases/PLAN.md
          cd releases && sha256sum *.apk *.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VPSDeck-${{ github.sha }}
          path: |
            apps/vpsdeck/build.log
            apps/vpsdeck/releases/
            apps/vpsdeck/app/build/reports/tests/
            apps/vpsdeck/app/build/test-results/
            apps/vpsdeck/app/build/reports/lint-results-debug.*
          retention-days: 14
