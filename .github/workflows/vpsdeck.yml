name: VPS Deck Android
on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/vpsdeck/**'
      - '.github/workflows/vpsdeck.yml'
permissions:
  contents: read
concurrency:
  group: vpsdeck-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/vpsdeck
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
      - name: Website adapter tests and disposable Nginx acceptance
        run: |
          python3 -m unittest discover -s tests -v
          sudo apt-get update -qq
          sudo apt-get install -y nginx
          sudo env VPSDECK_NGINX_ACCEPTANCE=1 python3 tests/accept_nginx.py
      - name: Tests, APK and lint
        run: |
          set +e
          VPSDECK_LINUX_ACCEPTANCE=1 ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:lintDebug 2>&1 | tee build.log
          result=${PIPESTATUS[0]}
          python3 scripts/report_ci.py build.log
          exit "$result"
      - name: Prepare delivery
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk releases/VPSDeck-0.2.0-stageC-dev-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk releases/VPSDeck-0.2.0-stageC-dev-unsigned.apk
          git -C ../.. archive --format=zip HEAD:apps/vpsdeck > releases/VPSDeck-source.zip
          python3 - <<'PYZIP'
          import zipfile
          with zipfile.ZipFile('releases/VPSDeck-source.zip') as archive:
              required = {'gradlew', 'gradle/wrapper/gradle-wrapper.jar', 'app/src/main/AndroidManifest.xml', 'app/src/main/java/dev/vpsdeck/MainActivity.kt'}
              assert required <= set(archive.namelist()), 'Source ZIP is empty or incomplete'
              assert archive.testzip() is None, 'Corrupt source archive'
          PYZIP
          cp ../../VPSDECK_PLAN.md releases/PLAN.md
          cd releases && sha256sum *.apk *.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VPSDeck-${{ github.sha }}
          path: |
            apps/vpsdeck/build.log
            apps/vpsdeck/releases/
            apps/vpsdeck/app/build/reports/tests/
            apps/vpsdeck/app/build/test-results/
            apps/vpsdeck/app/build/reports/lint-results-debug.*
          retention-days: 14
