name: VPS Deck Android device tests
on:
  workflow_dispatch:
  push:
    paths:
      - apps/vpsdeck/app/src/androidTest/**
      - .github/workflows/vpsdeck-device.yml
permissions:
  contents: read
jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          working-directory: apps/vpsdeck
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VPSDeck-device-tests
          path: |
            apps/vpsdeck/app/build/reports/androidTests/
            apps/vpsdeck/app/build/outputs/androidTest-results/
          retention-days: 14
